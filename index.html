<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e11" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bench Comeback</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<style>
/* Layout: one phone column, a training log. Graphite and white, no decoration: colour appears only where it carries meaning
   (amber = clock running, green = done, red = warning or working muscle). */
:root {
  --bg: #f2f3f4; --surface: #ffffff; --surface-2: #e8eaed; --ink: #111418; --ink-2: #5d6670; --line: #d6dadf;
  --on-ink: #ffffff; --signal: #a86a00; --good: #1d7a52; --good-bg: #e1f1ea; --hot: #b9442e;
  --bar-bg: #111418; --bar-ink: #ffffff; --bar-ink-2: #a7afb8; --bar-btn: rgba(255, 255, 255, .14);
  --fig: #2c343d; --fig-far: #a3abb4; --steel: #7b858f; --pad: #c5cbd2; --iron: #14181d; --ground: #c9ced4; --fig-bg: #eceef0;
  --display: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabs-h: 56px; --plate: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e11; --surface: #15181c; --surface-2: #1e2228; --ink: #f1f3f5; --ink-2: #98a1ab; --line: #2a2f36;
    --on-ink: #0c0e11; --signal: #e6a93a; --good: #49b98a; --good-bg: #12301f; --hot: #dc6a52;
    --bar-bg: #1e2228; --bar-ink: #f1f3f5; --bar-ink-2: #98a1ab; --bar-btn: rgba(255, 255, 255, .1);
    --fig: #cdd3d9; --fig-far: #59626c; --steel: #7f8993; --pad: #333a43; --iron: #3d4650; --ground: #2f353d; --fig-bg: #101317;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e11; --surface: #15181c; --surface-2: #1e2228; --ink: #f1f3f5; --ink-2: #98a1ab; --line: #2a2f36;
  --on-ink: #0c0e11; --signal: #e6a93a; --good: #49b98a; --good-bg: #12301f; --hot: #dc6a52;
  --bar-bg: #1e2228; --bar-ink: #f1f3f5; --bar-ink-2: #98a1ab; --bar-btn: rgba(255, 255, 255, .1);
  --fig: #cdd3d9; --fig-far: #59626c; --steel: #7f8993; --pad: #333a43; --iron: #3d4650; --ground: #2f353d; --fig-bg: #101317;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#view { padding-bottom: calc(var(--tabs-h) + 100px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack > .pill { align-self: flex-start; }
.row { display: flex; align-items: center; gap: 10px; }
.row > .grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.display { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; text-wrap: balance; }

/* page header */
.band { border-bottom: 1px solid var(--line); }
.band .wrap { padding-block: 20px 18px; }
.band h1 { font-size: 32px; }
.band .tagline { color: var(--ink-2); font-weight: 500; margin-top: 2px; }
.rail { display: flex; gap: 3px; align-items: center; }
.rail i { flex: 1; height: 4px; border-radius: 1px; background: var(--line); display: block; }
.rail i.done { background: var(--ink); }
.rail i.now { background: var(--signal); }
.rail .gap { flex: none; width: 6px; background: transparent; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 10px; font-weight: 600; background: var(--surface-2); color: var(--ink); text-align: center; }
.btn.primary, .btn.gold { background: var(--ink); color: var(--on-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }
.btn.wide { width: 100%; }
.btn.danger { color: var(--hot); }
.btn:active { opacity: .8; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card h2 { font-size: 16px; font-weight: 600; }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-top: 10px; }
.note { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--ink-2); }
.note b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; vertical-align: middle; }
.pill.base { border-color: var(--ink-2); color: var(--ink); }
.pill.good, .pill.green { border-color: transparent; background: var(--good-bg); color: var(--good); }
.pill.gold, .pill.yellow { border-color: var(--signal); color: var(--signal); }
.pill.red { border-color: var(--hot); color: var(--hot); }

/* plan list (preview of a day) */
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plan li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; }
.plan li:first-child { border-top: 0; }
.plan .nm { flex: 1; min-width: 0; font-weight: 500; }
.plan .nm.b { font-weight: 700; }
.plan .tg { color: var(--ink-2); font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
.plan .ss { font-size: 10.5px; font-weight: 600; color: var(--ink-2); letter-spacing: .06em; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.tile b { display: block; font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
.tile span { font-size: 12px; color: var(--ink-2); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabs-h); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--ink-2); text-decoration: none; }
.tabs a svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 700; }

/* workout */
.wtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg); }
.wtop .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.wtop .ttl { flex: 1; min-width: 0; }
.wtop .ttl b { display: block; font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wtop .ttl span { display: block; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wprog { height: 3px; background: var(--line); }
.wprog i { display: block; height: 100%; background: var(--ink); transition: width .3s; }

.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ex.ssn { border-top-left-radius: 0; border-top-right-radius: 0; margin-top: -13px; border-top-style: dashed; }
.ex > button.hd { width: 100%; display: flex; gap: 12px; align-items: center; padding: 13px 14px; text-align: left; }
.ex .ix { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--surface-2); color: var(--ink-2); flex: none; font-variant-numeric: tabular-nums; }
.ex.done .ix { background: var(--good-bg); color: var(--good); }
.ex .hd .t { flex: 1; min-width: 0; }
.ex .hd .t b { display: block; font-weight: 600; font-size: 15.5px; }
.ex .hd .t > span { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ex .cnt { font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ex .bd { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.how { display: grid; grid-template-columns: 128px 1fr; gap: 12px; align-items: start; }
.how ul { margin: 0; padding-left: 16px; font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 5px; }
.how .fig { cursor: pointer; }
.target { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.target b { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.15; letter-spacing: -.02em; }
.target span { font-size: 12.5px; color: var(--ink-2); }

.sets { display: flex; flex-direction: column; gap: 6px; }
.sets .hdr, .set { display: grid; grid-template-columns: 22px 1fr 1fr 48px; gap: 8px; align-items: center; }
.sets .hdr { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); text-align: center; }
.set .n { font-weight: 600; color: var(--ink-2); text-align: center; font-size: 13px; }
.step { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; background: var(--surface-2); border-radius: 8px; height: 44px; min-width: 0; }
.step button { height: 44px; font-size: 20px; font-weight: 500; color: var(--ink-2); }
.step input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-weight: 700; font-size: 16px; padding: 0; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.step input::placeholder { color: var(--ink-2); font-weight: 500; opacity: .7; }
.chk { height: 44px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
.chk svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.set.done .chk { background: var(--good); border-color: var(--good); color: #fff; }
.set.done .step { background: var(--good-bg); }
.set .tag { grid-column: 2 / -1; font-size: 12px; color: var(--ink-2); margin-top: -2px; }
.linkrow { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
.linkrow button { color: var(--ink); padding: 6px 0; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.clock { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1.1; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

/* timer bar */
#rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bar-bg); color: var(--bar-ink); border-top: 1px solid var(--line); }
#rest.above { bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: 0; }
#rest .wrap { display: flex; align-items: center; gap: 14px; padding-block: 8px 9px; }
#rest .blk { display: flex; flex-direction: column; min-width: 0; }
#rest .blk.grow { flex: 1; }
#rest .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--bar-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rest .blk b { font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
#rest.resting #rb-rest b { color: var(--signal); }
#rest .sep { width: 1px; align-self: stretch; background: var(--bar-btn); }
#rest button { min-width: 44px; height: 40px; border-radius: 8px; background: var(--bar-btn); color: var(--bar-ink); font-weight: 600; font-size: 13.5px; padding: 0 10px; white-space: nowrap; }
#rest .ctl { gap: 6px; }
#rest .bar { height: 3px; background: transparent; }
#rest .bar i { display: block; height: 100%; width: 0; background: var(--signal); }
#rest.over { background: var(--good); color: #fff; border-top-color: var(--good); }
#rest.over .k { color: #fff; }

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 40; background: rgba(6, 8, 10, .6); display: flex; align-items: flex-end; justify-content: center; }
#sheet .panel { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
#sheet .panel > * { flex-shrink: 0; }
#sheet .panel > .fig { width: 100%; max-width: 250px; align-self: center; }
#sheet .panel > h2, #sheet .panel > div:not(.card) > h2 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -.02em; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabs-h) + 88px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--on-ink); padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 13.5px; max-width: 90%; text-align: center; }

/* program */
.wk { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.wk > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; text-align: left; }
.wk .no { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1; width: 32px; text-align: center; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wk .t { flex: 1; min-width: 0; }
.wk .t b { display: block; font-weight: 600; }
.wk .t > span { font-size: 13px; color: var(--ink-2); }
.wk .dots { display: flex; gap: 3px; }
.wk .dots i { width: 14px; height: 4px; border-radius: 1px; background: var(--line); }
.wk .dots i.d { background: var(--good); }
.wk .days { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.day { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.day .h { display: flex; align-items: center; gap: 8px; }
.day .h b { flex: 1; font-weight: 600; }
.day .h .est { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* exercises list */
.exlist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.exlist button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.exlist b { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.exlist span { font-size: 12px; color: var(--ink-2); }
.search { width: 100%; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--body); font-size: 10px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--ink); opacity: .07; stroke: none; }
.chart .dot { fill: var(--surface); stroke: var(--ink); stroke-width: 1.8; }
.chart .end { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.chart .ref { stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 4 4; }
.chart .reft { fill: var(--ink-2); font-weight: 600; }
.chart .bar { fill: var(--steel); }
.chart .barnow { fill: var(--ink); }
.chart .val { fill: var(--ink); font-weight: 700; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--ink-2); font-size: 14px; }

.hist { display: flex; flex-direction: column; }
.hist > div, .hist > button { display: flex; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; text-align: left; width: 100%; }
.hist > :first-child { border-top: 0; }
.hist .d { width: 52px; flex: none; font-size: 11px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.hist .m { flex: 1; min-width: 0; }
.hist .m b { display: block; font-weight: 600; }
.hist .m span { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.field input, .field select, textarea.io { height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 16px; font-weight: 600; width: 100%; min-width: 0; }
textarea.io { height: 110px; padding: 10px 12px; font-size: 12px; font-weight: 400; font-family: ui-monospace, Menlo, Consolas, monospace; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pct { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 18px; font-variant-numeric: tabular-nums; font-size: 14px; }
.pct div { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); }
.pct b { font-weight: 700; }
.plates { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; min-height: 54px; }
.plates .barx { height: 6px; width: 28px; background: var(--steel); border-radius: 1px; }
.plates i { display: grid; place-items: center; width: 22px; border-radius: 3px; background: var(--ink); color: var(--on-ink); font-style: normal; font-size: 10px; font-weight: 700; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--steel); }
.sync.ok i { background: var(--good); }
.sync.err i { background: var(--hot); }

@media (max-width: 350px) { .how { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* trainer-sheet pictures sit on a white plate in both themes, as they were drawn */
.pic { background: var(--plate); border-radius: 10px; overflow: hidden; display: grid; place-items: center; }
.pic img { display: block; width: 100%; height: auto; }
.how.wide { grid-template-columns: 1fr; }
.how.wide .pic img { width: auto; max-width: 100%; max-height: 190px; }
.exlist .fig, .exlist .pic { aspect-ratio: 4 / 3; }
.exlist .fig svg { height: 100%; }
.exlist .pic img { width: 100%; height: 100%; object-fit: contain; }
#sheet .panel > .pic img { width: auto; max-width: 100%; max-height: 260px; }

.io-file { font-size: 14px; max-width: 100%; color: var(--ink-2); }

/* figure rig */
.fig { background: var(--fig-bg); border-radius: 14px; overflow: hidden; }
.fig svg { display: block; width: 100%; height: auto; }
.fig line, .fig path { stroke-linecap: round; stroke-linejoin: round; fill: none; }
.fig .fb { stroke: var(--fig); }

<script>
const PIC = (() => { try { return JSON.parse(localStorage.getItem("benchComeback.pics") || "{}"); } catch (e) { return {}; } })();
/* ---------- Animated exercise figures: a small 2-D rig, two key poses per exercise ---------- */
const FIG = (() => {
  const L = { T: 40, N: 14, HR: 8, UA: 22, FA: 21, TH: 30, SH: 30, FT: 9, X: 8 };
  const rad = (d) => (d * Math.PI) / 180;
  const lerp = (a, b, t) => a + (b - a) * t;
  const f1 = (n) => Math.round(n * 10) / 10;

  function ik(A, T, l1, l2, s) {
    const dx = T[0] - A[0], dy = T[1] - A[1];
    const d = Math.hypot(dx, dy) || 0.001;
    const dc = Math.min(l1 + l2 - 0.3, Math.max(Math.abs(l1 - l2) + 0.3, d));
    const base = Math.atan2(dy, dx);
    const a = Math.acos((l1 * l1 + dc * dc - l2 * l2) / (2 * l1 * dc));
    return [
      [A[0] + l1 * Math.cos(base + s * a), A[1] + l1 * Math.sin(base + s * a)],
      [A[0] + dc * Math.cos(base), A[1] + dc * Math.sin(base)],
    ];
  }
  const polar = (o, len, deg) => [o[0] + len * Math.cos(rad(deg)), o[1] + len * Math.sin(rad(deg))];

  function mix(A, B, t) {
    const o = {};
    for (const k in A) {
      const a = A[k], b = k in B ? B[k] : a;
      o[k] = Array.isArray(a) ? a.map((v, i) => lerp(v, b[i], t)) : typeof a === "number" ? lerp(a, b, t) : a;
    }
    return o;
  }

  /* ---- drawing helpers ---- */
  const ln = (p, q, w, c) => `<line x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(q[0])}" y2="${f1(q[1])}" stroke-width="${w}" class="${c}"/>`;
  const ci = (p, r, c) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" class="${c}"/>`;
  const el = (p, rx, ry, rot, c) => `<ellipse cx="${f1(p[0])}" cy="${f1(p[1])}" rx="${rx}" ry="${ry}" transform="rotate(${f1(rot)} ${f1(p[0])} ${f1(p[1])})" class="${c}"/>`;
  const rc = (x, y, w, h, rot, c, r = 2.5) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" ${rot ? `transform="rotate(${rot} ${x + w / 2} ${y + h / 2})"` : ""} class="${c}"/>`;
  const plate = (p, r) => ci(p, r, "fw") + ci(p, Math.max(2, r * 0.22), "fwh");

  function statics(list) {
    let s = "";
    for (const it of list || []) {
      const [k, ...a] = it;
      if (k === "rect") s += rc(a[0], a[1], a[2], a[3], a[4] || 0, a[5] || "fp");
      else if (k === "line") s += ln([a[0], a[1]], [a[2], a[3]], a[4] || 3, a[5] || "fe");
      else if (k === "circ") s += ci([a[0], a[1]], a[2], a[3] || "fef");
    }
    return s;
  }

  /* ---- side-view rig ---- */
  function solveSide(p, d) {
    const hip = p.h, th = rad(p.t || 0);
    const u = [Math.sin(th), -Math.cos(th)], n = [Math.cos(th), Math.sin(th)];
    const loc = (a) => [hip[0] + u[0] * a[0] + n[0] * a[1], hip[1] + u[1] * a[0] + n[1] * a[1]];
    const S = loc([L.T, 0]);
    const th2 = th + rad(p.hd || 0);
    const head = [S[0] + Math.sin(th2) * L.N, S[1] - Math.cos(th2) * L.N];
    const J = { hip, S, head, th: p.t || 0, loc };
    const arm = (sfx) => {
      const g = (k) => p[k + sfx] ?? (sfx ? p[k] : undefined);
      let a = g("a") || (g("al") && loc(g("al")));
      let e = g("e") || (g("el") && loc(g("el")));
      if (e && g("aa") != null) a = polar(e, L.FA, g("aa"));
      else if (!e && a) [e, a] = ik(S, a, L.UA, L.FA, d.eb ?? 1);
      else if (!e) [e, a] = ik(S, [S[0] + 3, S[1] + 42], L.UA, L.FA, 1);
      const x = g("xa") != null ? polar(a, L.X, g("xa")) : null;
      return { e, a, x };
    };
    const leg = (sfx) => {
      const g = (k) => p[k + sfx] ?? (sfx ? p[k] : undefined);
      let f = g("f"), k = g("k");
      if (k && g("fa") != null) f = polar(k, L.SH, g("fa"));
      else if (!k) [k, f] = ik(hip, f, L.TH, L.SH, d.kb ?? -1);
      return { k, f, toe: [f[0] + L.FT * Math.cos(rad(p.fd ?? 0)), f[1] + L.FT * Math.sin(rad(p.fd ?? 0))] };
    };
    J.A = arm(""); J.A2 = arm("2"); J.G = leg(""); J.G2 = leg("2");
    return J;
  }

  const SPOT = {
    chest: [31, 3.4, 7, 3.6], abs: [15, 3.4, 9, 3.4], lowback: [10, -3.4, 8, 3.4],
    lats: [24, -3.2, 9, 3.8], traps: [37, -3.4, 5, 3.4], glute: [-1, -3.5, 6.5, 6],
  };

  function anchor(J, at) {
    if (Array.isArray(at)) return at;
    if (at && at.l) return J.loc(at.l);
    return { a: J.A.a, a2: J.A2.a, x: J.A.x || J.A.a, f: J.G.f, e: J.A.e, S: J.S, hip: J.hip, k: J.G.k }[at];
  }

  function props(J, list) {
    let s = "";
    for (const it of list || []) {
      const [k, ...a] = it;
      if (k === "plate") s += plate(anchor(J, a[0]), a[1]);
      else if (k === "db") { const p = anchor(J, a[0]); s += rc(f1(p[0] - 7), f1(p[1] - 3.5), 14, 7, a[1] || 0, "fw", 2); }
      else if (k === "cable") { const p = anchor(J, a[1]); s += ln(a[0], p, 1.6, "fc") + ci(p, 2.6, "fef"); }
      else if (k === "roller") s += ci(anchor(J, a[0]).map((v, i) => v + (a[2] || [0, 0])[i]), a[1], "fp");
      else if (k === "tbar") {
        const p = anchor(J, a[1]), dx = p[0] - a[0][0], dy = p[1] - a[0][1], d = Math.hypot(dx, dy);
        const q = [p[0] + (dx / d) * a[2], p[1] + (dy / d) * a[2]];
        s += ln(a[0], q, 3, "fe") + plate(q, a[3]);
      }
    }
    return s;
  }

  function drawSide(J, d) {
    const hot = new Set(d.hot || []);
    const limbs = (A, G, c) =>
      ln(J.hip, G.k, 10, c) + ln(G.k, G.f, 8, c) + ln(G.f, G.toe, 6, c);
    const arms = (A, c) => ln(J.S, A.e, 7.5, c) + ln(A.e, A.a, 6.5, c) + (A.x ? ln(A.a, A.x, 5.5, c) : ci(A.a, 3.3, c + "f"));
    let s = statics(d.eq);
    s += props(J, d.back);
    if (!d.oneArm) s += arms(J.A2, "ff");
    else s += arms(J.A2, "ff");
    s += limbs(J.A2, J.G2, "ff");
    s += ln(J.hip, J.S, 13, "fb") + ln(J.S, J.head, 5, "fb") + ci(J.head, L.HR, "fbf");
    for (const k of hot) if (SPOT[k]) { const q = SPOT[k]; s += el(J.loc([q[0], q[1]]), q[2], q[3], J.th - 90, "fh"); }
    s += limbs(J.A, J.G, "fb");
    if (hot.has("thigh")) s += ln(J.hip, J.G.k, 6, "fhs");
    if (hot.has("shin")) s += ln(J.G.k, J.G.f, 4.5, "fhs");
    s += arms(J.A, "fb");
    if (hot.has("delt")) s += ci(J.S, 5, "fh");
    if (hot.has("uarm")) s += ln(J.S, J.A.e, 4.2, "fhs");
    if (hot.has("farm")) s += ln(J.A.e, J.A.a, 3.6, "fhs");
    s += props(J, d.props);
    return s;
  }

  /* ---- front-view rig (symmetric) ---- */
  function solveFront(p, d) {
    const cx = p.h[0], hy = p.h[1], sy = hy - L.T - (p.sh || 0);
    const side = (m) => {
      const S = [cx + m * 17, sy], H = [cx + m * 8.5, hy];
      const mx = (q) => q && [cx + m * (q[0] - cx), q[1]];
      let a = mx(p.a), e = mx(p.e);
      if (!e) { const r = ik(S, a, L.UA, L.FA, m * (d.eb ?? 1)); e = r[0]; a = r[1]; }
      let f = mx(p.f), k = mx(p.k);
      if (f && !k) k = [lerp(H[0], f[0], 0.5), lerp(H[1], f[1], 0.5)];
      return { S, H, a, e, f, k, m };
    };
    return { cx, hy, sy, R: side(1), Lf: side(-1), head: [cx, sy - L.N - (p.sh ? -p.sh * 0.5 : 0)] };
  }

  const FSPOT = {
    chest: (J, m) => el([J.cx + m * 8, J.sy + 9], 7, 5, 0, "fh"),
    traps: (J, m) => el([J.cx + m * 9, J.sy - 1.5], 7, 3.4, m * 18, "fh"),
    lats: (J, m) => el([J.cx + m * 11.5, J.sy + 19], 3.8, 10, m * -12, "fh"),
    abs: (J, m) => (m > 0 ? el([J.cx, J.sy + 26], 6, 9, 0, "fh") : ""),
  };

  function drawFront(J, d) {
    const hot = new Set(d.hot || []);
    let s = statics(d.eq);
    const both = (fn) => fn(J.R) + fn(J.Lf);
    if (d.lying) {
      s += el([J.cx, J.sy + 2], 22, 9, 0, "fbf");
      if (hot.has("chest")) s += el([J.cx - 11, J.sy + 2], 8, 5, 0, "fh") + el([J.cx + 11, J.sy + 2], 8, 5, 0, "fh");
    } else {
      if (J.R.f) s += both((q) => ln(q.H, q.k, 10, "fb") + ln(q.k, q.f, 8, "fb") + ln(q.f, [q.f[0] + q.m * 6, q.f[1] + 1], 6, "fb"));
      s += `<path d="M${f1(J.cx - 17)} ${f1(J.sy)}L${f1(J.cx + 17)} ${f1(J.sy)}L${f1(J.cx + 8.5)} ${J.hy}L${f1(J.cx - 8.5)} ${J.hy}Z" stroke-width="9" class="fb fbf"/>`;
      s += ln([J.cx, J.sy], J.head, 5, "fb");
      for (const k of hot) if (FSPOT[k]) s += FSPOT[k](J, 1) + FSPOT[k](J, -1);
    }
    if (d.barBehind) s += frontProps(J, d.props);
    s += ci(J.head, L.HR, "fbf");
    s += both((q) => ln(q.S, q.e, 7.5, "fb") + ln(q.e, q.a, 6.5, "fb") + ci(q.a, 3.3, "fbf"));
    if (hot.has("delt")) s += both((q) => ci(q.S, 5.2, "fh"));
    if (hot.has("uarm")) s += both((q) => ln(q.S, q.e, 4.2, "fhs"));
    if (hot.has("farm")) s += both((q) => ln(q.e, q.a, 3.6, "fhs"));
    if (!d.barBehind) s += frontProps(J, d.props);
    return s;
  }

  function frontProps(J, list) {
    let s = "";
    for (const it of list || []) {
      const [k, ...a] = it;
      const y = J.R.a[1];
      if (k === "bar") {
        const w = a[0], r = a[1];
        s += ln([J.cx - w, y], [J.cx + w, y], 3, "fe");
        s += rc(f1(J.cx - w - 1), f1(y - r), 5, r * 2, 0, "fw", 2) + rc(f1(J.cx + w - 4), f1(y - r), 5, r * 2, 0, "fw", 2);
      } else if (k === "dbh") {
        for (const q of [J.R, J.Lf]) s += rc(f1(q.a[0] - 8), f1(q.a[1] - 3.5), 16, 7, 0, "fw", 2);
      } else if (k === "dbe") {
        for (const q of [J.R, J.Lf]) s += rc(f1(q.a[0] - 4.5), f1(q.a[1] - 4.5), 9, 9, 0, "fw", 2.5);
      }
    }
    return s;
  }

  /* ---- exercise definitions ---- */
  const G = 150;
  const ground = ["line", 14, G, 206, G, 1.5, "fg"];
  const benchEq = [ground, ["rect", 54, 108, 78, 7, 0, "fp"], ["line", 66, 115, 66, G, 3.5], ["line", 120, 115, 120, G, 3.5]];
  const benchLegs = { f: [152, 146], f2: [146, 146] };
  const stack = (x) => [["line", x, -4, x, G, 4], ["rect", x - 7, 96, 14, 54, 0, "fw"]];

  const D = {
    hyper: {
      v: "s", hot: ["lowback", "glute", "thigh"],
      eq: [ground, ["line", 40, G, 126, G, 4], ["line", 104, 110, 108, G, 4], ["line", 58, 140, 46, G, 4], ["rect", 82, 100, 30, 8, -45, "fp"], ["circ", 55, 133, 5, "fp"]],
      A: { h: [102, 96], t: 128, al: [29, 8], f: [60, 138], hd: -12 },
      B: { h: [102, 96], t: 45, al: [29, 8], f: [60, 138], hd: 0 }, kb: 1,
    },
    bench: {
      v: "s", hot: ["chest", "delt", "uarm"], eq: [...benchEq, ["line", 76, 52, 76, G, 3]],
      A: { h: [124, 100], t: -90, e: [84, 78], a: [84, 57], ...benchLegs },
      B: { h: [124, 100], t: -90, e: [91, 108], a: [91, 87], ...benchLegs },
      props: [["plate", "a", 14]],
    },
    incline: {
      v: "s", hot: ["chest", "delt", "uarm"],
      eq: [ground, ["rect", 62, 93, 70, 7, 30, "fp"], ["rect", 122, 110, 26, 7, 0, "fp"], ["line", 84, 96, 84, G, 3.5], ["line", 134, 117, 134, G, 3.5]],
      A: { h: [124, 103], t: -60, e: [89, 61], a: [89, 40], f: [156, 146], f2: [150, 146] },
      B: { h: [124, 103], t: -60, e: [96, 91], a: [96, 70], f: [156, 146], f2: [150, 146] },
      props: [["plate", "a", 13]],
    },
    fly: {
      v: "f", lying: true, hot: ["chest", "delt"], eb: -1,
      eq: [ground, ["rect", 90, 108, 40, 7, 0, "fp"], ["line", 110, 115, 110, G, 4], ["line", 92, G, 128, G, 4]],
      A: { h: [110, 140], a: [117, 59] },
      B: { h: [110, 140], a: [166, 98] },
      props: [["dbe"]],
    },
    dbpress: {
      v: "f", hot: ["delt", "uarm"], eb: 1,
      eq: [ground, ["rect", 97, 58, 26, 58, 0, "fp"], ["rect", 90, 116, 40, 7, 0, "fp"], ["line", 110, 123, 110, G, 4]],
      A: { h: [110, 112], a: [141, 62], k: [124, 121], f: [126, 146] },
      B: { h: [110, 112], a: [131, 30], k: [124, 121], f: [126, 146] },
      props: [["dbh"]],
    },
    lateral: {
      v: "f", hot: ["delt"], eb: 1, eq: [ground],
      A: { h: [110, 88], a: [133, 89], f: [121, 146] },
      B: { h: [110, 88], a: [168, 51], f: [121, 146] },
      props: [["dbe"]],
    },
    shrug: {
      v: "f", hot: ["traps"], eb: 1, eq: [ground],
      A: { h: [110, 88], a: [132, 90], f: [121, 146], sh: 0 },
      B: { h: [110, 88], a: [132, 82], f: [121, 146], sh: 8 },
      props: [["dbe"]],
    },
    uprow: {
      v: "f", hot: ["delt", "traps"], eb: -1, eq: [ground],
      A: { h: [110, 88], a: [118, 90], f: [121, 146] },
      B: { h: [110, 88], a: [118, 57], f: [121, 146] },
      props: [["bar", 44, 9]],
    },
    rpec: {
      v: "f", hot: ["delt", "traps"],
      eq: [ground, ["rect", 97, 60, 26, 56, 0, "fp"], ["rect", 90, 116, 40, 7, 0, "fp"], ["line", 110, 123, 110, G, 4]],
      A: { h: [110, 112], e: [128, 80], a: [121, 72], k: [124, 121], f: [126, 146] },
      B: { h: [110, 112], e: [148, 74], a: [168, 72], k: [124, 121], f: [126, 146] },
      props: [["dbe"]],
    },
    curl: {

      A: { h: [100, 87], t: 0, e: [100, 69], aa: 78, f: [100, 146], f2: [96, 146] },
      B: { h: [100, 87], t: 0, e: [101, 69], aa: -64, f: [100, 146], f2: [96, 146] },
      props: [["plate", "a", 9]],
    },
    wrist: {

      eq: [ground, ["rect", 78, 118, 44, 7, 0, "fp"], ["line", 88, 125, 88, G, 3.5], ["line", 114, 125, 114, G, 3.5]],
      A: { h: [94, 112], t: 26, e: [112, 103], a: [132, 107], xa: 55, k: [124, 113], f: [126, 146] },
      B: { h: [94, 112], t: 26, e: [112, 103], a: [132, 107], xa: -50, k: [124, 113], f: [126, 146] },
      props: [["plate", "x", 6.5]],
    },
    abs: {

      A: { h: [116, 139], t: -90, al: [44, 9], f: [158, 142], hd: 0 },
      B: { h: [116, 139], t: -52, al: [44, 9], f: [158, 142], hd: 18 }, kb: -1,
    },
    squat: {

      A: { h: [100, 87], t: 4, el: [24, -9], al: [36, -5], f: [104, 146], hd: 0 },
      B: { h: [84, 117], t: 36, el: [24, -9], al: [36, -5], f: [104, 146], hd: -24 },
      back: [], props: [["plate", { l: [37, -6] }, 13]],
    },
    legext: {

      eq: [ground, ["rect", 78, 62, 8, 52, -12, "fp"], ["rect", 84, 110, 42, 7, 0, "fp"], ["rect", 92, 117, 22, 33, 0, "fw"]],
      A: { h: [94, 104], t: -12, a: [100, 110], k: [124, 104], fa: 84 },
      B: { h: [94, 104], t: -12, a: [100, 110], k: [124, 104], fa: 6 },

    },
    deadlift: {

      A: { h: [84, 110], t: 62, a: [118, 134], f: [104, 146], hd: -38 },
      B: { h: [102, 87], t: 0, a: [106, 129], f: [104, 146], hd: 0 },
      props: [["plate", "a", 14]],
    },
    sldl: {
      v: "s", hot: ["thigh", "glute", "lowback"], eq: [ground],
      A: { h: [90, 90], t: 78, a: [128, 126], f: [104, 146], hd: -30 },
      B: { h: [102, 87], t: 0, a: [106, 129], f: [104, 146], hd: 0 },
      props: [["plate", "a", 14]],
    },

function parseSeg(s) {
  const m = /^(K|BW|T(\d+)|(\d+(?:\.\d+)?)(kg|min)?)(?:x(\d+)x(\d+))?$/.exec(s.trim());
  if (!m) throw new Error("bad spec " + s);
  const r = +m[5] || 0, n = +m[6] || 1;
  if (m[1] === "K") return { k: "own", r, s: n };
  if (m[1] === "BW") return { k: "bw", r, s: n };
  if (m[2]) return { k: "test", v: +m[2], r: 0, s: 1 };
  if (m[4] === "min") return { k: "time", v: +m[3], r: 0, s: 1 };
  if (m[4] === "kg") return { k: "kg", v: +m[3], r, s: n };
  return { k: "pct", v: +m[3], r, s: n };
}
function parseItem(str) {
  let note = "";
  const h = str.indexOf("#");
  if (h >= 0) { note = str.slice(h + 1).trim(); str = str.slice(0, h); }
  str = str.trim();
  let ss = false;
  if (str.endsWith("+")) { ss = true; str = str.slice(0, -1).trim(); }
  const one = (s) => { const [ex, spec] = s.trim().split("@"); if (!EX[ex]) throw new Error("unknown exercise " + ex); return { ex, segs: spec.split(";").map(parseSeg) }; };
  const [a, b] = str.split(" / ");
  return { ...one(a), alt: b ? one(b) : null, ss, note };
}

const DAY_LETTER = ["a", "b", "c", "d", "e"];
function buildDays(weekId, phase, rows, ritual) {
  return rows.map((row, i) => {
    const [name, ...items] = row;
    const list = items.map(parseItem);
    const hasHyper = list.some((it) => it.ex === "hyper" || it.ex === "hyperw");
    const pre = [parseItem("warm@10min")];
    if (!hasHyper) pre.push(parseItem(ritual));
    const full = [...pre.map((x) => ({ ...x, ritual: true })), ...list];
    if (!list.some((it) => it.ex === "meditate")) full.push(parseItem("cardio@30min"));
    return { id: weekId + DAY_LETTER[i], name, phase, items: full };
  });
}

  const roundKg = (kg) => { const st = S.settings.round || 2.5; return Math.round(kg / st) * st; };
  const maxFor = (ex) => (EX[ex].max ? S.settings.max[EX[ex].max] || 0 : 0);
  const MAXNAME = { bench: "bench", squat: "squat", dead: "deadlift" };
  function segW(ex, seg) {
    if (seg.k === "pct" || seg.k === "test") { const m = maxFor(ex); return m ? roundKg((m * seg.v) / 100) : null; }
    if (seg.k === "kg") return seg.v;
    return null;
  }
  const variant = (it, st) => (st && st.alt && it.alt ? it.alt : it);
  const nSets = (v) => v.segs.reduce((a, s) => a + s.s, 0);
  const setsOf = (n, r) => `${n} ${n === 1 ? "set" : "sets"} of ${r}`;

  function summary(v) {
    const s = v.segs, a = s[0];
    if (a.k === "time") return a.v + " min";
    if (a.k === "test") { const w = segW(v.ex, a); return "Rep test at " + (w ? fmt(w) + " kg" : a.v + "%"); }
    if (s.length === 1) {
      if (a.k === "pct") { const w = segW(v.ex, a); return (w ? fmt(w) + " kg" : a.v + "% of " + MAXNAME[EX[v.ex].max] + " max") + " · " + setsOf(a.s, a.r); }
      if (a.k === "kg") return fmt(a.v) + " kg · " + setsOf(a.s, a.r);
      return setsOf(a.s, a.r) + (a.k === "bw" ? "" : "");
    }
    const ws = s.map((x) => segW(v.ex, x)).filter((x) => x != null);
    return nSets(v) + " sets" + (ws.length ? " · " + fmt(Math.min(...ws)) + "–" + fmt(Math.max(...ws)) + " kg" : " · build up");
  }

  const logsSorted = () => Object.values(S.logs).filter((l) => !l.del).sort((a, b) => b.start - a.start);
  const finished = () => logsSorted().filter((l) => l.end);
  function lastSets(ex, exceptId) {
    for (const l of logsSorted()) {
      if (l.id === exceptId) continue;
      for (const k in l.items) { const st = l.items[k]; if (st.ex === ex) { const d = st.sets.filter((s) => s.d); if (d.length) return { sets: d, t: l.start }; } }
    }
    return null;
  }
  function suggest(ex) {
    const old = EX[ex].old; if (!old) return null;
    const weeks = S.settings.started ? Math.floor((Date.now() - S.settings.started) / 6048e5) : 0;
    const kg = old * Math.min(1, 0.6 + 0.1 * weeks);
    return kg < 20 ? Math.max(1, Math.round(kg)) : Math.round(kg / 2.5) * 2.5;
  }
  function defaultRows(v, exceptId) {
    const rows = [], last = lastSets(v.ex, exceptId), sug = suggest(v.ex);
    let i = 0;
    for (const seg of v.segs) for (let n = 0; n < seg.s; n++, i++) {
      let w = segW(v.ex, seg);
      if (seg.k === "own") w = last ? (last.sets[i] || last.sets[last.sets.length - 1]).w : sug;
      if (seg.k === "bw") w = last && last.sets[i] && last.sets[i].w ? last.sets[i].w : null;
      rows.push({ w: w == null || w === "" ? "" : w, r: seg.k === "test" || seg.k === "time" ? "" : seg.r, d: false });
    }
    return rows;
  }
  function planRow(v, i) { let n = 0; for (const seg of v.segs) { if (i < n + seg.s) return seg; n += seg.s; } return null; }

  const doneLog = (dayId) => finished().find((l) => l.day === dayId && (DAYS[dayId].phase === "split" || l.end >= (S.settings.cycleStart || 0)));
  function nextDay() {
    let lastIdx = -1, lastEnd = 0;
    PATH.forEach((d, i) => { const l = doneLog(d.id); if (l && l.end > lastEnd) { lastEnd = l.end; lastIdx = i; } });
    for (let i = lastIdx + 1; i < PATH.length; i++) if (!doneLog(PATH[i].id)) return PATH[i];
    return null;
  }
  const logVolume = (l) => Object.values(l.items).reduce((a, st) => a + st.sets.reduce((b, s) => b + (s.d && +s.w > 0 && +s.r > 0 ? s.w * s.r : 0), 0), 0);
  const logSets = (l) => Object.values(l.items).reduce((a, st) => a + st.sets.filter((s) => s.d).length, 0);
  function bestE1(ex, beforeT = Infinity, exceptId) {
    let best = 0;
    for (const l of finished()) {
      if (l.start >= beforeT || l.id === exceptId) continue;
      for (const k in l.items) { const st = l.items[k]; if (st.ex !== ex) continue; for (const s of st.sets) if (s.d && +s.w > 0 && +s.r > 0 && s.r <= 12) best = Math.max(best, e1rm(+s.w, +s.r)); }
    }
    return best;
  }
  function platesFor(total) {
    let side = (total - S.settings.bar) / 2; const out = [];
    if (side < 0) return null;
    for (const p of [25, 20, 15, 10, 5, 2.5, 1.25]) while (side >= p - 1e-9) { out.push(p); side -= p; }
    return { out, rest: Math.round(side * 100) / 100 };
  }
  const platesText = (w) => { const p = platesFor(w); return !p ? "" : p.out.length ? "Each side: " + p.out.map(fmt).join(" + ") : "Empty bar"; };

  /* ---------- workout actions ---------- */
  const activeLog = () => (S.active && S.logs[S.active] && !S.logs[S.active].del ? S.logs[S.active] : null);
  function startDay(dayId, force) {
    const cur = activeLog();
    if (cur && !force) {
      if (cur.day === dayId) return go("workout");
      return sheet(`<h2>Workout in progress</h2><p class="muted">${esc(dayTitle(DAYS[cur.day]))} is still open with ${logSets(cur)} sets logged.</p>
        <button class="btn primary wide" data-a="resume">Resume it</button>
        <button class="btn wide danger" data-a="discard-start" data-day="${dayId}">Discard it and start ${esc(DAYS[dayId].name)}</button>`);
    }
    if (cur && force) { S.logs[cur.id] = { id: cur.id, del: true, u: Date.now() }; push("log_" + cur.id); }
    const day = DAYS[dayId], id = Date.now().toString(36);
    const log = { id, day: dayId, date: dkey(), start: Date.now(), end: 0, items: {}, u: 0 };
    day.items.forEach((it, i) => { log.items[i] = { ex: it.ex, alt: false, sets: defaultRows(it, id) }; });
    S.logs[id] = log; S.active = id;
    if (!S.settings.started) { S.settings.started = Date.now(); touchSettings(); }
    touchLog(log);
    ui.open = 0; ui.timers = {};
    closeSheet(); go("workout");
  }
  const itemDone = (st) => st.sets.length > 0 && st.sets.every((s) => s.d);
  function firstOpen(log, after = -1) {
    const day = DAYS[log.day], ok = (i) => !itemDone(log.items[i]) && !skipToday(log, day.items[i], log.items[i]);
    for (let i = after + 1; i < day.items.length; i++) if (ok(i)) return i;
    for (let i = 0; i <= after; i++) if (ok(i)) return i;
    return -1;
  }
  const restFor = (ex) => EX[ex].rest || (EX[ex].base ? S.settings.restBase : S.settings.restAcc);

  function toggleSet(idx, si) {
    const log = activeLog(); if (!log) return;
    const day = DAYS[log.day], it = day.items[idx], st = log.items[idx], set = st.sets[si], v = variant(it, st);
    const seg = planRow(v, si) || v.segs[v.segs.length - 1];
    if (!set.d) {
      if (seg.k !== "time" && !(+set.r > 0)) return toast("Enter the reps you did first");
      set.d = true; set.t = Date.now();
      touchLog(log);
      const ex = v.ex;
      const partnerNext = it.ss ? idx + 1 : null, partnerPrev = idx > 0 && day.items[idx - 1].ss ? idx - 1 : null;
      if (partnerNext != null && !itemDone(log.items[partnerNext])) { ui.open = partnerNext; toast("Superset: straight to " + EX[variant(day.items[partnerNext], log.items[partnerNext]).ex].n); }
      else {
        if (seg.k !== "time" && seg.k !== "test") startRest(restFor(ex), EX[ex].n);
        if (partnerPrev != null && !itemDone(log.items[partnerPrev])) ui.open = partnerPrev;
        else if (itemDone(st) && seg.k !== "test") { const n = firstOpen(log, idx); if (n >= 0) ui.open = n; }
      }
    } else { set.d = false; touchLog(log); }
    render(true);
  }
  function finishWorkout() {
    const log = activeLog(); if (!log) return;
    const prs = [];
    const seen = new Set();
    for (const k in log.items) {
      const st = log.items[k]; if (seen.has(st.ex) || !EX[st.ex].eq || EX[st.ex].eq === "bw") continue; seen.add(st.ex);
      let cur = 0; for (const s of st.sets) if (s.d && +s.w > 0 && +s.r > 0 && s.r <= 12) cur = Math.max(cur, e1rm(+s.w, +s.r));
      const prev = bestE1(st.ex, Infinity, log.id);
      if (cur > 0 && prev > 0 && cur > prev + 0.01) prs.push(EX[st.ex].n);
    }
    log.end = Date.now(); S.active = null; ui.rest = null; drawRest();
    touchLog(log);
    const mins = Math.max(1, Math.round((log.end - log.start) / 60000)), vol = logVolume(log);
    go("today");
    sheet(`<p class="eyebrow">${esc(dayTitle(DAYS[log.day]))}</p><h2>Session logged</h2>
      <div class="tiles"><div class="tile"><b class="num">${mins}</b><span>minutes</span></div><div class="tile"><b class="num">${logSets(log)}</b><span>sets</span></div><div class="tile"><b class="num">${vol >= 1000 ? fmt(Math.round(vol / 100) / 10) + " t" : Math.round(vol)}</b><span>${vol >= 1000 ? "lifted" : "kg lifted"}</span></div></div>
      ${prs.length ? `<div class="note"><b>New best:</b> ${prs.map(esc).join(", ")}</div>` : ""}
      ${testBox(log)}
      <button class="btn primary wide" data-a="close">Done</button>`);
  }
  function testResult(log) {
    const day = DAYS[log.day];
    for (let i = 0; i < day.items.length; i++) if (day.items[i].segs[0].k === "test") { const s = log.items[i].sets[0]; if (s.d && +s.w > 0 && +s.r > 0) return { w: +s.w, r: +s.r, est: e1rm(+s.w, +s.r) }; }
    return null;
  }
  function testBox(log) {
    const t = testResult(log); if (!t) return "";
    const m = Math.floor(t.est / 2.5) * 2.5;
    return `<div class="card stack"><p class="eyebrow">Rep test</p><p><b class="num">${fmt(t.w)} kg × ${t.r}</b> works out to a max of about <b class="num">${fmt(Math.round(t.est * 10) / 10)} kg</b>.${t.r > 10 ? " More than 10 reps makes the estimate rough: retest heavier if you want a tighter number." : ""}</p>
      ${S.settings.max.bench === m ? `<span class="pill good">Bench max is ${fmt(m)} kg</span>` : `<button class="btn gold wide" data-a="setmax" data-v="${m}">Use ${fmt(m)} kg as my bench max</button>`}
      <p class="small muted">The guide's rule: this number stays fixed for all 13 weeks.</p></div>`;
  }
  function setBenchMax(v) {
    S.settings.max.bench = v;
    S.settings.maxHist = [...(S.settings.maxHist || []), { t: Date.now(), v }].slice(-40);
    touchSettings();
  }

  /* ---------- rest timer + sound ---------- */
  let actx = null;
  function beep(times = 3) {
    if (!S.settings.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      for (let i = 0; i < times; i++) {
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.28;
        o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.start(t); o.stop(t + 0.22);
      }
    } catch (e) { /* no audio */ }
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* no vibration */ }
  }
  function primeAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) { /* no audio */ } }
  function startRest(sec, label) { ui.rest = { end: Date.now() + sec * 1000, total: sec, label, over: 0 }; drawRest(); }
  function lastSetT(log) { let t = 0; for (const k in log.items) for (const s of log.items[k].sets) if (s.d && s.t > t) t = s.t; return t; }
  function drawRest() {
    const n = $("#rest"), log = activeLog(), inW = ui.view === "workout" && !!log;
    let r = ui.rest;
    if (r && Date.now() >= r.end && !r.over) { r.over = Date.now(); beep(3); }
    if (r && r.over && Date.now() - r.over > 8000) r = ui.rest = null;
    if (!r && !inW) { n.hidden = true; return; }
    const resting = !!(r && !r.over);
    n.hidden = false;
    n.classList.toggle("above", ui.view !== "workout");
    n.classList.toggle("over", !!(r && r.over));
    n.classList.toggle("resting", resting);
    $("#rb-total").hidden = $("#rb-sep").hidden = !inW;
    if (inW) $("#rb-total b").textContent = clock((Date.now() - log.start) / 1000);
    const k = $("#rb-rest .k"), b = $("#rb-rest b");
    if (resting) { k.textContent = "Rest · " + r.label; b.textContent = clock((r.end - Date.now()) / 1000); }
    else if (r) { k.textContent = "Rest is over"; b.textContent = "Go"; }
    else { const t = lastSetT(log); k.textContent = t ? "Since last set" : "Between sets"; b.textContent = t ? clock((Date.now() - t) / 1000) : "–:––"; }
    $("#rest .bar i").style.width = resting ? Math.min(100, (1 - (r.end - Date.now()) / 1000 / r.total) * 100) + "%" : "0";
    $("#rest .ctl").hidden = !resting;
    $("#rb-start").hidden = !(inW && !resting);
  }
  /* planning: how long a session takes = sets x (about 40 s of work + the rest) + a minute to set up each exercise */
  function estimate(day, log) {
    let sec = 0, opt = 0;
    day.items.forEach((it, i) => {
      const st = log ? log.items[i] : null, v = variant(it, st), e = EX[v.ex];
      const left = st ? st.sets.filter((s) => !s.d).length : nSets(v);
      if (!left) return;
      const t = e.timed ? v.segs[0].v * 60 : left * (40 + (it.ss ? 15 : restFor(v.ex))) + 60;
      if (log ? skipToday(log, it, st) : e.optional) opt += t; else sec += t;
    });
    return { min: Math.round(sec / 60), opt: Math.round(opt / 60) };
  }
  const estText = (day) => "≈ " + Math.round(estimate(day).min / 5) * 5 + " min";
  const estNote = (day) => { const e = estimate(day); return `About ${Math.round(e.min / 5) * 5} minutes start to finish: warm-up, every set, and rests of ${clock(S.settings.restBase)} on base lifts and ${clock(S.settings.restAcc)} on the rest.${e.opt ? ` Optional cardio adds ${e.opt} minutes.` : ""}`; };
  let wake = null;
  async function keepAwake() { try { if (ui.view === "workout" && navigator.wakeLock && document.visibilityState === "visible") wake = await navigator.wakeLock.request("screen"); } catch (e) { /* not granted */ } }

  /* ---------- small UI pieces ---------- */
  const dayTitle = (d) => (d.phase === "split" ? d.name : d.week.title + " · " + d.name);
  function planList(day, log) {
    return `<ul class="plan">${day.items.map((it, i) => {
      const st = log ? log.items[i] : null, v = variant(it, st), e = EX[v.ex];
      return `<li><span class="nm ${e.base ? "b" : ""}">${esc(e.n)}${it.alt && !st ? ` <span class="muted small">or ${esc(EX[it.alt.ex].n)}</span>` : ""}${it.ss ? ' <span class="ss">SUPERSET ↓</span>' : ""}${e.optional ? ' <span class="muted small">optional</span>' : ""}</span><span class="tg">${esc(summary(v))}</span></li>`;
    }).join("")}</ul>`;
  }
  function rail(next) {
    let h = '<div class="rail" aria-hidden="true">';
    PROGRAM.forEach((w, i) => {
      if (i === 3) h += '<i class="gap"></i>';
      const all = w.days.every((d) => doneLog(d.id));
      h += `<i class="${all ? "done" : next && next.week.id === w.id ? "now" : ""}"></i>`;
    });
    return h + "</div>";
  }
  function coachNote(day) {
    if (!day) return "";
    const id = day.week.id;
    const N = {
      r1: ["Two weeks of full-body sessions before the split: every muscle three times a week, two easy sets each. Everything should feel too easy. Stop every set with 4 or more reps left. You will be sore on days 2 and 3 anyway.", "BJJ: one light session this week, drilling over sparring."],
      r2: ["Full body again, now three sets. No grinding yet: the bar moves at the same speed on the last rep as on the first.", "BJJ: two sessions this week."],
      r3: ["This week switches to the program's own split. The third session is test day: one honest set for reps at about 80%, stopped one rep short of failure. It sets your max for the 13 weeks.", "BJJ: back to three if you are recovering well. Keep hard sparring away from the day before the test."],
    }[id];
    if (N) return `<div class="note"><b>Comeback rule.</b> ${N[0]}<br>${N[1]}</div>`;
    const G = ["Your max is fixed for the whole cycle. Do not add weight, do not test yourself, do not train to failure.", "Bad sleep or a bad day? Do the base lifts and go home.", "Rest 3–5 minutes on base lifts, 1–2 minutes on everything else.", "Records are for the platform. In training you polish the skill."];
    return `<div class="note"><b>From the guide.</b> ${G[(day.week.n + PATH.indexOf(PATH.find((p) => p.id === day.id))) % G.length]}</div>`;
  }

  /* ---------- pictures: the trainer-sheet illustration where one exists, the drawn figure otherwise ---------- */
  const PICMAP = { hyper: "hyper", hyperw: "hyper", bench: "bench", benchneg: "bench", benchspd: "bench", benchboard: "bench", benchcg: "benchcg", benchmg: "benchmg",
    incline: "incline", fly: "fly", incfly: "fly", dbpress: "dbpress", lateral: "lateral", rpec: "rpec", dips: "dips", hammer: "hammer", supcurl: "supcurl", rcurl: "rcurl",
    pushdown: "pushdown", rpushdown: "pushdown", ohext: "ohext", uprow: "uprow", latpull: "latpull", latpullcg: "latpull", latpullw: "latpullw", row: "row", row1: "row", shrug: "shrug" };
  const hasPic = (ex) => typeof PIC !== "undefined" && !!PIC[PICMAP[ex]];
  const pic = (ex, anim) => hasPic(ex) ? `<div class="pic"><img src="${PIC[PICMAP[ex]]}" alt="${esc(EX[ex].n)}: start and end position"></div>` : FIG.html(EX[ex].fig, anim);

  function loadPics(inp) {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result);
        if (!j || j.app !== "bench-comeback-pictures" || typeof j.pics !== "object") throw new Error("wrong file");
        const ok = {};
        for (const k in j.pics) if (typeof j.pics[k] === "string" && j.pics[k].startsWith("data:image/jpeg;base64,")) ok[k] = j.pics[k];
        localStorage.setItem("benchComeback.pics", JSON.stringify(ok));
        for (const k in PIC) delete PIC[k];
        Object.assign(PIC, ok);
        render(true); toast(Object.keys(ok).length + " pictures loaded");
      } catch (e) { toast("That is not the Bench Comeback pictures file"); }
    };
    rd.readAsText(f);
  }

  /* ---------- views ---------- */
  function viewToday() {
    const next = nextDay(), cur = activeLog(), ws = weekStart(Date.now());
    const lifts = finished().filter((l) => l.end >= ws).length;
    const acts = S.acts.list.filter((a) => a.t >= ws);
    const bjj = acts.filter((a) => a.kind === "bjj").length, cardio = acts.filter((a) => a.kind === "cardio").length;
    const today = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    let h = `<section class="band"><div class="wrap stack">
      <p class="eyebrow">${esc(today)}</p>
      ${next ? `<div><h1 class="display">${esc(next.week.title)}</h1><p class="tagline">${esc(next.week.tag)}</p></div>${rail(next)}
        <p class="muted small">${next.week.phase === "ramp" ? "3 comeback weeks, then the 13-week program" : "13-week program"} · session ${next.week.days.findIndex((d) => d.id === next.id) + 1} of ${next.week.days.length} this week</p>`
      : `<div><h1 class="display">Cycle complete</h1><p class="tagline">Celebrate, then go again</p></div>${rail(null)}<p class="muted small">Enter your new max in Tools and start the next cycle from there.</p>`}
    </div></section><div class="wrap stack" style="padding-top:16px">`;
    if (cur) h += `<div class="card stack"><p class="eyebrow">In progress</p><h2>${esc(dayTitle(DAYS[cur.day]))}</h2><p class="muted small">${logSets(cur)} sets logged · started ${new Date(cur.start).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })} · ≈ ${estimate(DAYS[cur.day], cur).min} min left</p><button class="btn gold wide" data-a="resume">Resume workout</button></div>`;
    if (next && !(cur && cur.day === next.id)) h += `<div class="card stack"><div class="row"><div class="grow"><p class="eyebrow">Next up</p><h2>${esc(next.name)}</h2></div><span class="pill">${estText(next)}</span></div>
      ${planList(next)}
      <p class="small muted">${estNote(next)}</p>
      <button class="btn primary wide" data-a="start" data-day="${next.id}">Start workout</button>
      <button class="btn ghost wide sm" data-a="nav" data-v="program">Pick a different day</button></div>`;
    h += coachNote(next);
    h += `<div class="tiles"><div class="tile"><b class="num">${lifts}</b><span>lifting this week</span></div><div class="tile"><b class="num">${bjj}</b><span>BJJ this week</span></div><div class="tile"><b class="num">${fmt(S.settings.max.bench)}</b><span>bench max, kg</span></div></div>
      <div class="card stack"><h2>Log something else</h2><div class="grid2"><button class="btn" data-a="act" data-kind="bjj">+ BJJ session</button><button class="btn" data-a="act" data-kind="cardio">+ Cardio</button></div>${cardio ? `<p class="small muted">${cardio} cardio ${cardio === 1 ? "session" : "sessions"} this week</p>` : ""}</div>
      <p class="small muted" style="text-align:center">${syncBadge()}</p></div>`;
    return h;
  }

  function viewProgram() {
    const next = nextDay();
    if (ui.openWeek == null) ui.openWeek = next ? next.week.id : "r1";
    const wk = (w) => {
      const open = ui.openWeek === w.id;

  function benchChart() {
    const pts = [];
    for (const l of finished().slice().reverse()) {
      let best = 0;
      for (const k in l.items) { const st = l.items[k]; if (st.ex !== "bench") continue; for (const s of st.sets) if (s.d && +s.w > 0 && +s.r > 0 && s.r <= 12) best = Math.max(best, e1rm(+s.w, +s.r)); }
      if (best) pts.push({ t: l.start, v: Math.round(best * 10) / 10 });
    }
    if (!pts.length) return `<div class="empty">Your bench line starts with the first session you log. The dashed line it will climb toward is your old best, ${fmt(S.settings.best)} kg.</div>`;
    const W = 328, H = 176, L = 30, Rr = 12, T = 14, B = 24, ref = S.settings.best;
    const lo = Math.floor((Math.min(...pts.map((p) => p.v)) - 5) / 10) * 10, hi = Math.ceil((Math.max(ref, ...pts.map((p) => p.v)) + 3) / 10) * 10;
    const x = (i) => (pts.length === 1 ? (L + W - Rr) / 2 : L + (i * (W - L - Rr)) / (pts.length - 1)), y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    let g = "";
    const step = hi - lo > 60 ? 20 : 10;
    for (let v = lo; v <= hi; v += step) g += `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
    const path = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join("");
    const last = pts[pts.length - 1];
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated bench max per session, latest ${last.v} kg, old best ${ref} kg">${g}
      <line class="ref" x1="${L}" x2="${W - Rr}" y1="${y(ref)}" y2="${y(ref)}"/><text class="reft" x="${W - Rr}" y="${y(ref) - 5}" text-anchor="end">Old best ${fmt(ref)}</text>
      ${pts.length > 1 ? `<path class="area" d="${path}L${x(pts.length - 1)} ${H - B}L${x(0)} ${H - B}Z"/><path class="line" d="${path}"/>` : ""}
      ${pts.map((p, i) => `<circle class="${i === pts.length - 1 ? "end" : "dot"}" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 5 : 3.2}"/>`).join("")}
      <text class="val" x="${Math.min(W - Rr, x(pts.length - 1)).toFixed(1)}" y="${(y(last.v) - 10).toFixed(1)}" text-anchor="end">${fmt(last.v)}</text>
      <text x="${L}" y="${H - 6}">${shortDate(pts[0].t)}</text>${pts.length > 1 ? `<text x="${W - Rr}" y="${H - 6}" text-anchor="end">${shortDate(last.t)}</text>` : ""}</svg>`;
  }
  function weekChart() {
    const now = weekStart(Date.now()), weeks = [];
    for (let i = 7; i >= 0; i--) { const s = now - i * 6048e5 + 36e5; const a = weekStart(s); weeks.push({ a, vol: 0, n: 0 }); }
    for (const l of finished()) { const w = weeks.find((x) => x.a === weekStart(l.end)); if (w) { w.vol += logVolume(l); w.n++; } }
    if (!weeks.some((w) => w.n)) return `<div class="empty">Eight weeks of training load will stack up here, one bar per week.</div>`;
    const W = 328, H = 150, T = 18, B = 34, bw = 26, gap = (W - 8 * bw) / 8, mx = Math.max(...weeks.map((w) => w.vol), 1);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tonnes lifted per week for the last eight weeks"><line class="grid" x1="0" x2="${W}" y1="${H - B}" y2="${H - B}"/>${weeks.map((w, i) => {
      const x = gap / 2 + i * (bw + gap), h = Math.max(w.n ? 3 : 0, (w.vol / mx) * (H - T - B));
      return `<rect class="${i === 7 ? "barnow" : "bar"}" x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="4"/>
        ${w.n ? `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(H - B - h - 5).toFixed(1)}" text-anchor="middle">${(w.vol / 1000).toFixed(1)}</text>` : ""}
        <text x="${(x + bw / 2).toFixed(1)}" y="${H - B + 13}" text-anchor="middle">${shortDate(w.a).replace(" ", " ")}</text><text x="${(x + bw / 2).toFixed(1)}" y="${H - B + 26}" text-anchor="middle">${w.n ? w.n + "×" : "·"}</text>`;
    }).join("")}</svg>`;
  }
  function viewProgress() {

  function bestSetText(ex) {
    let best = null;
    for (const l of finished()) for (const k in l.items) { const st = l.items[k]; if (st.ex !== ex) continue; for (const s of st.sets) if (s.d && +s.w > 0 && +s.r > 0 && s.r <= 12) { const e = e1rm(+s.w, +s.r); if (!best || e > best.e) best = { e, w: s.w, r: s.r, t: l.end }; } }

  function viewTools() {
    const c = ui.calc, est = e1rm(+c.w || 0, +c.r || 1), s = S.settings;
    const p = platesFor(+ui.plate || 0);
    return `<section class="band"><div class="wrap stack"><p class="eyebrow">Tools</p><h1 class="display">Maxes and tools</h1></div></section>
      <div class="wrap stack" style="padding-top:16px">
      <div class="card stack"><div><h2>Your maxes</h2><p class="small muted">Every percentage in the program is worked out from these. The guide's rule: set them once per cycle and leave them alone.</p></div>
        <div class="grid3"><div class="field"><label for="mx-bench">Bench, kg</label><input id="mx-bench" data-set="max.bench" type="number" inputmode="decimal" step="2.5" value="${s.max.bench || ""}"></div>

        <p class="small muted">Bench starts at 75 kg, a cautious guess at about 70% of your old 105 after the layoff. The rep test at the end of comeback week 3 replaces it. With no squat or deadlift max, those lifts show the percentage and you pick a comfortable weight.</p>
        <div class="field"><label for="mx-best">Old best bench, kg (the line on the chart)</label><input id="mx-best" data-set="best" type="number" inputmode="decimal" step="2.5" value="${s.best}"></div></div>

      <div class="card stack"><h2>Timer and rounding</h2><div class="grid2">

        <div class="field"><label for="s-rd">Round weights to</label><select id="s-rd" data-set="round">${[1.25, 2.5, 5].map((v) => `<option value="${v}" ${s.round === v ? "selected" : ""}>${v} kg</option>`).join("")}</select></div>

      ${window.claude ? "" : `<div class="card stack"><h2>Exercise pictures</h2><p class="small muted">${Object.keys(PIC).length ? Object.keys(PIC).length + " pictures from your trainer sheets are loaded and kept on this phone." : "This copy shows drawn figures. To see the pictures from your trainer sheets, choose the file “Bench Comeback pictures.json” from your OneDrive. They are stored on this phone only."}</p><input class="io-file" id="picfile" type="file" accept=".json,application/json" aria-label="Pictures file">${Object.keys(PIC).length ? `<button class="btn sm ghost danger" data-a="pics-clear">Remove the pictures</button>` : ""}</div>`}

  function calcOut() {

  function viewWorkout() {

  function exBody(log, day, i, it, st, v, e) {

    if (e.timed) {

      return h;
    }
    // target block
    const last = lastSets(v.ex, log.id);
    let big, sub = [];
    if (seg0.k === "test") {
      const w = segW(v.ex, seg0);
      big = (w ? fmt(w) + " kg" : seg0.v + "%") + " × max reps";

      const w = segW(v.ex, seg0);
      big = (w != null ? fmt(w) + " kg" : seg0.v + "%") + " × " + seg0.r + " × " + seg0.s;
      if (seg0.k === "pct") sub.push(w != null ? `${seg0.v}% of your ${fmt(maxFor(v.ex))} kg ${MAXNAME[e.max]} max` : `${seg0.v}% of your ${MAXNAME[e.max]} max. No max set, so pick a weight that leaves 3 reps in the tank`);

      big = nSets(v) + " sets";
      sub.push(v.segs.every((s) => s.k === "pct") ? "Ladder: " + v.segs.map((s) => `${s.v}%×${s.r}${s.s > 1 ? "×" + s.s : ""}`).join(", ") : "Build up set by set");

    sub.push(`Rest ${clock(restFor(v.ex))} between sets`);
