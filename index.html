      ${last ? `<span>Last time, ${shortDate(last.t)}: ${esc(last.sets.map((s) => (s.w ? fmt(s.w) + "×" : "") + s.r).join(", "))}</span>` : e.old && v.segs.some((s) => s.k === "own") ? `<span>Starting suggestion from your old ${fmt(e.old)} kg</span>` : ""}</div>`;
    // sets
    const stepW = e.eq === "db" || e.eq === "plate" ? 1 : S.settings.round;
    h += `<div class="sets"><div class="hdr"><span></span><span>kg</span><span>reps</span><span></span></div>${st.sets.map((s, si) => {
      const seg = planRow(v, si);
      return `<div class="set ${s.d ? "done" : ""}"><span class="n">${si + 1}</span>
        <div class="step"><button data-a="stp" data-i="${i}" data-s="${si}" data-f="w" data-d="${-stepW}" aria-label="Less weight">−</button><input id="w-${log.id}-${i}-${si}" data-i="${i}" data-s="${si}" data-f="w" type="number" inputmode="decimal" step="any" placeholder="${e.eq === "bw" ? "BW" : "kg"}" value="${s.w === "" ? "" : s.w}" aria-label="Set ${si + 1} weight"><button data-a="stp" data-i="${i}" data-s="${si}" data-f="w" data-d="${stepW}" aria-label="More weight">+</button></div>
        <div class="step"><button data-a="stp" data-i="${i}" data-s="${si}" data-f="r" data-d="-1" aria-label="Fewer reps">−</button><input id="r-${log.id}-${i}-${si}" data-i="${i}" data-s="${si}" data-f="r" type="number" inputmode="numeric" step="1" placeholder="${seg && seg.k === "test" ? "max" : "reps"}" value="${s.r === "" ? "" : s.r}" aria-label="Set ${si + 1} reps"><button data-a="stp" data-i="${i}" data-s="${si}" data-f="r" data-d="1" aria-label="More reps">+</button></div>
        <button class="chk" data-a="set" data-i="${i}" data-s="${si}" aria-label="${s.d ? "Undo set " : "Complete set "}${si + 1}" aria-pressed="${s.d}">${ICON.check}</button>
        ${seg && seg.k === "pct" && v.segs.length > 1 ? `<span class="tag">${seg.v}% · target ${seg.r} reps</span>` : ""}</div>`;
    }).join("")}</div>`;
    if (seg0.k === "test") { const t = testResult(log); if (t) h += testBox(log); }
    h += `<div class="linkrow"><button data-a="addset" data-i="${i}">+ Add a set</button>${st.sets.length > 1 ? `<button data-a="rmset" data-i="${i}">Remove last set</button>` : ""}${it.alt ? `<button data-a="alt" data-i="${i}">Swap to ${esc(EX[(st.alt ? it : it.alt).ex].n)}</button>` : ""}<button data-a="ex" data-ex="${v.ex}">Technique and history</button></div>`;
    return h;
  }

  /* ---------- recovery (entered by hand from the Whoop app) ---------- */
  const recBand = (r) => (r == null || r === "" ? null : r < 34 ? "red" : r < 67 ? "yellow" : "green");
  const REC_TXT = {
    red: "The guide's rule for a bad day: do the base lifts and go home. Everything else is optional today.",
    yellow: "Run the session as written. Drop the last accessory sets if it drags.",
    green: "Train as written. Still no extra weight on the bar.",
  };
  function skipToday(log, it, st) { const e = EX[variant(it, st).ex]; return !!e.optional || (recBand(log.rec) === "red" && !it.ritual && !e.base); }
  function recCard(log) {
    const b = recBand(log.rec);
    return `<div class="card"><div class="row"><div class="grow"><h2>Whoop recovery ${b ? `<span class="pill ${b}">${b.toUpperCase()}</span>` : ""}</h2><p class="small muted">${b ? REC_TXT[b] : "Optional. Enter today's recovery % from the Whoop app and the session adapts."}</p></div>
      <div class="step" style="width:120px;flex:none"><button data-a="rec" data-d="-5" aria-label="Lower recovery">−</button><input id="rec-${log.id}" data-rec type="number" inputmode="numeric" min="0" max="100" step="1" placeholder="%" value="${log.rec ?? ""}" aria-label="Whoop recovery percent"><button data-a="rec" data-d="5" aria-label="Higher recovery">+</button></div></div></div>`;
  }
  function onRec(inp, rerender) {
    const log = activeLog(); if (!log) return;
    const v = inp.value === "" ? NaN : Math.round(parseFloat(inp.value));
    log.rec = isNaN(v) ? null : Math.min(100, Math.max(0, v));
    touchLog(log);
    if (rerender) render(true);
  }

  /* ---------- sheets ---------- */
  function sheet(html) { const n = $("#sheet"); n.innerHTML = `<div class="panel" role="dialog" aria-modal="true">${html}</div>`; n.hidden = false; FIG.mount(n); }
  function closeSheet() { const n = $("#sheet"); n.hidden = true; n.innerHTML = ""; }
  let toastT = 0;
  function toast(msg) { const n = $("#toast"); n.textContent = msg; n.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { n.hidden = true; }, 2600); }

  function exSheet(ex) {
    const e = EX[ex], hist = [];
    for (const l of finished()) { for (const k in l.items) { const st = l.items[k]; if (st.ex === ex) { const d = st.sets.filter((s) => s.d); if (d.length) hist.push({ t: l.end, d }); } } if (hist.length >= 6) break; }
    const be = bestE1(ex);
    sheet(`<div><p class="eyebrow">${esc(e.m)}</p><h2>${esc(e.n)}</h2><p class="small muted">${esc(e.ru)}</p></div>
      ${pic(ex, true)}
      <div class="card"><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px">${e.cues.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>
      ${e.max ? `<p class="small muted">Percentages for this lift come from your ${MAXNAME[e.max]} max${maxFor(ex) ? " (" + fmt(maxFor(ex)) + " kg)" : ", which is not set yet"}.</p>` : ""}
      <div class="card stack"><div class="row"><h2 class="grow">Your record</h2>${be ? `<span class="pill num">≈ ${fmt(Math.round(be))} kg max</span>` : ""}</div>
      ${hist.length ? `<div class="hist">${hist.map((x) => `<div><span class="d">${shortDate(x.t)}</span><span class="m"><span>${esc(x.d.map((s) => (s.w ? fmt(s.w) + "×" : "") + s.r).join(", "))}</span></span></div>`).join("")}</div>` : `<p class="small muted">${e.old ? `Nothing logged yet. Your old working weight was about ${fmt(e.old)} kg.` : "Nothing logged yet."}</p>`}</div>
      <button class="btn wide" data-a="close">Close</button>`);
  }
  function logSheet(id) {
    const l = S.logs[id]; if (!l) return;
    const day = DAYS[l.day];
    sheet(`<div><p class="eyebrow">${new Date(l.end).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })}</p><h2>${esc(dayTitle(day))}</h2></div>
      <div class="card"><div class="hist">${Object.keys(l.items).map((k) => { const st = l.items[k], d = st.sets.filter((s) => s.d); if (!d.length) return ""; const e = EX[st.ex];
        return `<div><span class="m"><b>${esc(e.n)}</b><span>${e.timed ? "done" : esc(d.map((s) => (s.w ? fmt(s.w) + "×" : "") + s.r).join(", "))}</span></span></div>`; }).join("") || '<p class="muted small">No sets were logged.</p>'}</div></div>
      <div class="grid2"><button class="btn sm" data-a="reopen" data-id="${id}">Reopen to edit</button><button class="btn sm danger" data-a="log-del" data-id="${id}">Delete</button></div>
      <button class="btn wide" data-a="close">Close</button>`);
  }
  function actSheet(kind) {
    sheet(`<h2>${kind === "bjj" ? "Log a BJJ session" : "Log cardio"}</h2>
      <div class="field"><label for="act-min">Minutes</label><input id="act-min" type="number" inputmode="numeric" step="5" value="${kind === "bjj" ? 90 : 30}"></div>
      <button class="btn primary wide" data-a="act-save" data-kind="${kind}">Save</button><button class="btn wide" data-a="close">Cancel</button>`);
  }

  /* ---------- render + routing ---------- */
  const VIEWS = { today: viewToday, program: viewProgram, progress: viewProgress, exercises: viewExercises, tools: viewTools, workout: viewWorkout };
  function render(keepScroll) {
    const y = window.scrollY, v = $("#view");
    v.innerHTML = VIEWS[ui.view]();
    $(".tabs").hidden = ui.view === "workout";
    document.querySelectorAll(".tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.v === ui.view ? "page" : "false"));
    FIG.mount(v);
    drawRest();
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  }
  function go(view) {
    if (!VIEWS[view]) view = "today";
    if (view === "workout" && !activeLog()) view = "today";
    const same = ui.view === view;
    ui.view = view;
    try { if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view); } catch (e) { location.hash = view; }
    if (view === "workout") { const l = activeLog(); if (ui.open < 0 || itemDone(l.items[ui.open] || { sets: [] })) ui.open = firstOpen(l); keepAwake(); }
    render(same);
  }

  /* ---------- events ---------- */
  const A = {
    nav: (d) => go(d.v),
    start: (d) => { primeAudio(); startDay(d.day); },
    resume: () => { primeAudio(); closeSheet(); go("workout"); },
    "discard-start": (d) => startDay(d.day, true),
    week: (d) => { ui.openWeek = ui.openWeek === d.id ? "" : d.id; render(true); },
    open: (d) => { ui.open = ui.open === +d.i ? -1 : +d.i; render(true); if (ui.open >= 0) { const n = $("#ex-" + ui.open); if (n) { const r = n.getBoundingClientRect(); if (r.top < 70 || r.top > innerHeight * 0.6) window.scrollTo({ top: window.scrollY + r.top - 76, behavior: "smooth" }); } } },
    set: (d) => { primeAudio(); toggleSet(+d.i, +d.s); },
    stp: (d) => {
      const log = activeLog(); if (!log) return;
      const inp = $(`#${d.f}-${log.id}-${d.i}-${d.s}`), cur = parseFloat(inp.value);
      let nv = (isNaN(cur) ? 0 : cur) + parseFloat(d.d);
      if (d.f === "w" && isNaN(cur) && parseFloat(d.d) < 0) return;
      nv = Math.max(0, Math.round(nv * 100) / 100);
      inp.value = nv; onSetInput(inp);
    },
    addset: (d) => { const log = activeLog(), st = log.items[d.i], l = st.sets[st.sets.length - 1] || { w: "", r: "" }; st.sets.push({ w: l.w, r: l.r, d: false }); touchLog(log); render(true); },
    rmset: (d) => { const log = activeLog(), st = log.items[d.i]; if (st.sets.length > 1) st.sets.pop(); touchLog(log); render(true); },
    alt: (d) => { const log = activeLog(), it = DAYS[log.day].items[d.i], st = log.items[d.i]; st.alt = !st.alt; const v = variant(it, st); st.ex = v.ex; st.sets = defaultRows(v, log.id); touchLog(log); render(true); },
    tm: (d) => {
      primeAudio();
      const log = activeLog(), i = +d.i, seg = variant(DAYS[log.day].items[i], log.items[i]).segs[0];
      const tm = ui.timers[i] || (ui.timers[i] = { left: seg.v * 60, run: false });
      if (tm.run) { tm.left = Math.max(0, (tm.end - Date.now()) / 1000); tm.run = false; } else { if (tm.left <= 0) tm.left = seg.v * 60; tm.end = Date.now() + tm.left * 1000; tm.run = true; }
      render(true);
    },
    "finish-ask": () => {
      const log = activeLog(), n = logSets(log), day = DAYS[log.day];
      const left = day.items.filter((it, i) => !skipToday(log, it, log.items[i]) && !itemDone(log.items[i])).length;
      sheet(`<h2>Finish this workout?</h2><p class="muted">${n} sets logged${left ? `, ${left} ${left === 1 ? "exercise" : "exercises"} not completed` : ". Everything on the list is done"}.</p>
        ${n ? `<button class="btn gold wide" data-a="finish">Finish and save</button>` : ""}<button class="btn wide" data-a="close">Keep going</button>`);
    },
    finish: () => { closeSheet(); finishWorkout(); },
    "discard-ask": () => sheet(`<h2>Discard this workout?</h2><p class="muted">The sets you logged in this session will be deleted.</p><button class="btn wide danger" data-a="discard">Discard it</button><button class="btn wide primary" data-a="close">Keep it</button>`),
    discard: () => { const log = activeLog(); if (log) { S.logs[log.id] = { id: log.id, del: true, u: Date.now() }; push("log_" + log.id); } S.active = null; ui.rest = null; saveLocal(); closeSheet(); go("today"); },
    close: () => closeSheet(),
    "pics-clear": () => { try { localStorage.removeItem("benchComeback.pics"); } catch (e) { /* storage unavailable */ } for (const k in PIC) delete PIC[k]; render(true); toast("Pictures removed"); },
    rec: (d) => { const log = activeLog(); if (!log) return; log.rec = log.rec == null ? 50 : Math.min(100, Math.max(0, log.rec + +d.d)); touchLog(log); render(true); },
    ex: (d) => exSheet(d.ex),
    log: (d) => logSheet(d.id),
    "log-del": (d, el) => { if (el.dataset.sure) { S.logs[d.id] = { id: d.id, del: true, u: Date.now() }; saveLocal(); push("log_" + d.id); closeSheet(); render(true); toast("Workout deleted"); } else { el.dataset.sure = 1; el.textContent = "Tap again to delete"; } },
    reopen: (d) => { if (activeLog()) return toast("Finish the open workout first"); const l = S.logs[d.id]; l.end = 0; S.active = l.id; touchLog(l); closeSheet(); ui.open = -1; go("workout"); },
    act: (d) => actSheet(d.kind),
    "act-save": (d) => { const min = Math.max(1, Math.round(+$("#act-min").value || 0)); S.acts.list.push({ id: Date.now().toString(36), kind: d.kind, min, t: Date.now() }); touchActs(); closeSheet(); render(true); toast((d.kind === "bjj" ? "BJJ" : "Cardio") + " logged"); },
    "act-del": (d) => { S.acts.list = S.acts.list.filter((a) => a.id !== d.id); touchActs(); render(true); },
    setmax: (d) => { setBenchMax(+d.v); closeSheet(); render(true); toast("Bench max set to " + fmt(+d.v) + " kg"); },
    "rest-add": () => { if (ui.rest) { ui.rest.end += 15000; ui.rest.total += 15; drawRest(); } },
    "rest-sub": () => { if (ui.rest) { ui.rest.end -= 15000; drawRest(); } },
    "rest-skip": () => { ui.rest = null; drawRest(); },
    "rest-start": () => {
      const log = activeLog(); if (!log) return;
      primeAudio();
      const i = ui.open >= 0 ? ui.open : firstOpen(log);
      const e = i >= 0 ? EX[variant(DAYS[log.day].items[i], log.items[i]).ex] : null;
      startRest(!e || e.timed ? S.settings.restAcc : e.rest || (e.base ? S.settings.restBase : S.settings.restAcc), e && !e.timed ? e.n : "manual");
    },
    export: async () => {
      const txt = JSON.stringify({ app: "bench-comeback", v: 1, settings: S.settings, logs: S.logs, acts: S.acts });
      let ok = false;
      try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) { /* fall through to manual copy */ }
      sheet(`<h2>Backup</h2><p class="muted">${ok ? "Copied to the clipboard. Paste it into a note or an email to yourself." : "Select all of this text and copy it somewhere safe."}</p><textarea class="io" id="io" readonly>${esc(txt)}</textarea><button class="btn wide" data-a="close">Close</button>`);
      if (!ok) { const t = $("#io"); t.focus(); t.select(); }
    },
    "import-open": () => sheet(`<h2>Restore a backup</h2><p class="muted">Paste the backup text. Entries are merged with what is already here, and the newer copy of each workout wins.</p><textarea class="io" id="io" placeholder="Paste backup text here"></textarea><button class="btn primary wide" data-a="import">Restore</button><button class="btn wide" data-a="close">Cancel</button>`),
    import: () => {
      try {
        const j = JSON.parse($("#io").value);
        if (!j || j.app !== "bench-comeback") throw new Error("not a backup");
        for (const id in j.logs || {}) if (!S.logs[id] || (j.logs[id].u || 0) > (S.logs[id].u || 0)) { S.logs[id] = j.logs[id]; push("log_" + id); }
        if (j.settings && (j.settings.u || 0) > (S.settings.u || 0)) { applyLoaded({ settings: j.settings }); push("settings"); }
        if (j.acts && (j.acts.u || 0) > (S.acts.u || 0)) { S.acts = j.acts; push("acts"); }
        saveLocal(); closeSheet(); render(); toast("Backup restored");
      } catch (e) { toast("That text is not a Bench Comeback backup"); }
    },
    newcycle: (d, el) => { if (el.dataset.sure) { S.settings.cycleStart = Date.now(); touchSettings(); ui.openWeek = null; render(); toast("New cycle started. History is kept"); } else { el.dataset.sure = 1; el.textContent = "Tap again: restart from Comeback 1 / Week 1"; } },
    erase: (d, el) => {
      if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = "Tap again to erase every workout"; return; }
      for (const id in S.logs) { S.logs[id] = { id, del: true, u: Date.now() }; push("log_" + id); }
      S.acts = { list: [], u: Date.now() }; push("acts");
      S.settings = { ...JSON.parse(JSON.stringify(DEF)), u: Date.now() }; push("settings");
      S.active = null; saveLocal(); render(); toast("Everything erased");
    },
  };

  function onSetInput(inp) {
    const log = activeLog(); if (!log) return;
    const i = +inp.dataset.i, si = +inp.dataset.s, f = inp.dataset.f, st = log.items[i], set = st.sets[si];
    const val = inp.value === "" ? "" : Math.max(0, parseFloat(inp.value));
    const prev = set[f];
    set[f] = isNaN(val) ? "" : val;
    if (f === "w") {
      const v = variant(DAYS[log.day].items[i], st);
      for (let j = si + 1; j < st.sets.length; j++) {
        const seg = planRow(v, j);
        if (st.sets[j].d || (seg && (seg.k === "pct" || seg.k === "kg" || seg.k === "test"))) continue;
        if (st.sets[j].w === prev || st.sets[j].w === "") { st.sets[j].w = set.w; const o = $(`#w-${log.id}-${i}-${j}`); if (o) o.value = set.w; }
      }
    }
    touchLog(log);
  }

  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-a]");
    if (el) { ev.preventDefault(); const fn = A[el.dataset.a]; if (fn) fn(el.dataset, el); return; }
    if (ev.target.id === "sheet") closeSheet();
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if ("rec" in t.dataset) return onRec(t, false);
    if (t.matches(".step input")) return onSetInput(t);
    if (t.id === "exq") { ui.q = t.value; const q = ui.q.trim().toLowerCase(); $("#exgrid").innerHTML = exGrid(Object.keys(EX).filter((k) => !q || (EX[k].n + " " + EX[k].ru + " " + EX[k].m).toLowerCase().includes(q))); return; }
    if (t.dataset.calc) { ui.calc[t.dataset.calc] = t.value; $("#calc-out").innerHTML = calcOut(); return; }
    if ("plate" in t.dataset) { ui.plate = t.value; $("#plate-out").innerHTML = plateOut(); return; }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target, k = t.dataset.set;
    if (t.id === "picfile") return loadPics(t);
    if ("rec" in t.dataset) return onRec(t, true);
    if (!k) return;
    const num = k === "sound" ? !!t.value : Math.max(0, parseFloat(t.value) || 0);
    if (k.startsWith("max.")) { const m = k.slice(4); if (m === "bench") { if (num > 0) setBenchMax(num); else { t.value = S.settings.max.bench; return; } } else { S.settings.max[m] = num; touchSettings(); } }
    else { S.settings[k] = num; touchSettings(); }
    toast("Saved");
    if (k === "round") render(true);
  });
  document.addEventListener("focusin", (ev) => { if (ev.target.matches && ev.target.matches(".step input")) ev.target.select(); });
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== ui.view) go(v); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); drawRest(); } else saveLocal(); });

  setInterval(() => {
    if (ui.rest || ui.view === "workout") drawRest();
    if (ui.view !== "workout") return;
    const log = activeLog(); if (!log) return;
    const el = $("#elapsed"); if (el) el.textContent = clock((Date.now() - log.start) / 1000);
    for (const i in ui.timers) {
      const tm = ui.timers[i]; if (!tm.run) continue;
      const left = (tm.end - Date.now()) / 1000, n = $("#tm-" + i);
      if (n) n.textContent = clock(left);
      if (left <= 0) { tm.run = false; tm.left = 0; beep(3); if (!log.items[i].sets[0].d) toggleSet(+i, 0); else render(true); }
    }
  }, 250);

  /* ---------- boot ---------- */
  loadLocal();
  adoptOrphans();
  // installed on a phone, outside Claude: ask the browser to keep this app's storage
  if (!window.claude) { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* not supported */ } }
  const h0 = location.hash.slice(1);
  ui.view = VIEWS[h0] && (h0 !== "workout" || activeLog()) ? h0 : "today";
  if (ui.view === "workout") ui.open = firstOpen(activeLog());
  render();
  initRemote();
})();

</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
